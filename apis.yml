aid: punkapi
name: Punk API
description: >-
  Punk API is a free, no-auth REST API exposing BrewDog's "DIY Dog" open-source beer recipe collection — 325 detailed
  homebrew recipes crowdsourced and transcribed from the BrewDog DIY Dog PDF. The v2 surface (api.punkapi.com/v2)
  offered three read-only endpoints: list beers (with rich query filtering on ABV, IBU, EBC, brew date, beer name, hops,
  malt, yeast, and food pairing), get a beer by id, and get a random beer. Each beer carries a full recipe — ABV, IBU,
  EBC/SRM colour, target gravities, mash temperature schedule, fermentation temperature, twist, malt and hop bills,
  yeast strain, food pairings, brewer's tips, and contributor attribution. STATUS — DEPRECATED. BrewDog decommissioned
  the public api.punkapi.com endpoint in 2023 and the source repositories (sammdec/punkapi-db, sammdec/punkapi-server)
  were archived on 2023-06-28. The dataset and server source remain MIT-licensed and available; community-hosted mirrors
  and the `punkapi-db` npm package preserve the contract documented here.
url: https://punkapi.com
baseURL: https://api.punkapi.com/v2
