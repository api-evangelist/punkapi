apis:
  - name: Punk API — Beers
    description: >-
      Read-only REST surface over the 325 BrewDog DIY Dog beer recipes. Three operations — list (with
      ABV/IBU/EBC/date/ingredient filters and page/per_page pagination up to 80 items), get-by-id, and random. No
      authentication. The historical baseURL (api.punkapi.com/v2) is no longer reachable; self-host
      sammdec/punkapi-server or run a mirror.
